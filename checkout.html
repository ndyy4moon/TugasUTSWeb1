<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan Buku - BookSpace</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/data.js" defer></script>
    <script src="js/checkout.js" defer></script>
</head>
<body>

    <header class="dashboard-header">
        <h1>BookSpace</h1>
        <a href="dashboard.html" class="logout-btn">Kembali</a>
    </header>

    <main class="dashboard-container">

        <section class="welcome-section">
            <h2>Halaman Pemesanan Buku</h2>
            <p>Silakan pilih buku dan lengkapi informasi pemesanan.</p>
        </section>

        <!-- PILIH BUKU -->
        <section class="stok-container">
            <h2>Pilih Buku</h2>

            <form id="formTambahPesanan">
                <label for="pilihBuku">Judul Buku</label>
                <select id="pilihBuku" required>
                    <option value="">-- Pilih Buku --</option>
                </select>

                <label for="jumlahPesanan">Jumlah Buku</label>
                <input type="number" id="jumlahPesanan"
                       min="1" value="1" required>

                <button type="submit" class="btn-primary">
                    Tambahkan ke Pesanan
                </button>
            </form>
        </section>

        <!-- TABEL PESANAN -->
        <section class="tabel-container">
            <h2>Daftar Buku yang Dipesan</h2>

            <div class="table-responsive">
                <table class="tabel-stok">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Judul Buku</th>
                            <th>Harga</th>
                            <th>Jumlah</th>
                            <th>Subtotal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelPesanan">
                    </tbody>
                </table>
            </div>

            <h3 id="totalHarga">Total Pembayaran: Rp 0</h3>
        </section>

        <!-- INFORMASI PEMESAN -->
        <section class="stok-container">
            <h2>Informasi Pemesan</h2>

            <form id="formCheckout">

                <label for="namaPemesan">Nama Lengkap</label>
                <input type="text" id="namaPemesan"
                       placeholder="Masukkan nama lengkap" required>

                <label for="emailPemesan">Email</label>
                <input type="email" id="emailPemesan"
                       placeholder="Masukkan email" required>

                <label for="alamatPemesan">Alamat Pengiriman</label>
                <textarea id="alamatPemesan"
                          placeholder="Masukkan alamat lengkap"
                          rows="4" required></textarea>

                <label for="teleponPemesan">Nomor Telepon</label>
                <input type="tel" id="teleponPemesan"
                       placeholder="Masukkan nomor telepon" required>

                <h2>Informasi Pembayaran</h2>

                <label for="metodePembayaran">Metode Pembayaran</label>
                <select id="metodePembayaran" required>
                    <option value="">-- Pilih Pembayaran --</option>
                    <option value="Transfer Bank">Transfer Bank</option>
                    <option value="COD">COD (Bayar di Tempat)</option>
                    <option value="E-Wallet">E-Wallet</option>
                </select>

                <button type="submit" class="btn-primary">
                    Buat Pesanan
                </button>

            </form>
        </section>

    </main>

    <footer class="dashboard-footer">
        <p>&copy; 2026 Universitas Pelita Bangsa</p>
    </footer>

</body>
</html>
