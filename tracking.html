<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Pesanan - BookSpace</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/tracking.js" defer></script>
</head>
<body>

    <header class="dashboard-header">
        <h1>BookSpace</h1>
        <a href="dashboard.html" class="logout-btn">Kembali</a>
    </header>

    <main class="dashboard-container">

        <section class="welcome-section">
            <h2>Tracking Pesanan</h2>
            <p>Periksa status pengiriman pesanan buku Anda.</p>
        </section>

        <section class="stok-container">
            <h2>Cek Status Pengiriman</h2>

            <form id="formTracking">
                <label for="nomorDO">Nomor Delivery Order (DO)</label>
                <input type="text" id="nomorDO"
                       placeholder="Masukkan nomor DO" required>

                <button type="submit" class="btn-primary">
                    Lacak Pesanan
                </button>
            </form>

            <div id="hasilTracking"></div>
        </section>

    </main>

    <footer class="dashboard-footer">
        <p>&copy; 2026 Universitas Pelita Bangsa</p>
    </footer>

</body>
</html>
